pg_retention_lock_wait:
  query: |
    SELECT
      COALESCE(datname, 'unknown') AS database,
      COUNT(*)::float AS waiting_sessions,
      COALESCE(MAX(EXTRACT(EPOCH FROM (clock_timestamp() - query_start))), 0)::float AS max_wait_seconds,
      COALESCE(AVG(EXTRACT(EPOCH FROM (clock_timestamp() - query_start))), 0)::float AS avg_wait_seconds
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock'
      AND datname = current_database()
    GROUP BY datname
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database name
    - waiting_sessions:
        usage: GAUGE
        description: Number of sessions waiting on PostgreSQL locks
    - max_wait_seconds:
        usage: GAUGE
        description: Longest current PostgreSQL lock wait in seconds
    - avg_wait_seconds:
        usage: GAUGE
        description: Average current PostgreSQL lock wait in seconds
