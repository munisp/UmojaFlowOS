groups:
  - name: umoja-sod-incident-handler
    rules:
      - alert: UmojaSodIncidentHandlerFailures
        expr: increase(umoja_sod_incident_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: umoja-wazuh-integration
          compliance_domain: segregation_of_duties
        annotations:
          summary: UmojaFlowOS SoD incident delivery failure
          description: A Wazuh SoD incident-handler invocation failed in the last 5 minutes.
          runbook_url: https://docs.example.invalid/runbooks/umoja-sod-incident-handler

      - alert: UmojaSodIncidentFailureRateHigh
        expr: |
          (
            increase(umoja_sod_incident_failures_total[15m])
            /
            clamp_min(increase(umoja_sod_incident_requests_total[15m]), 1)
          ) > 0.10
          and increase(umoja_sod_incident_requests_total[15m]) >= 5
        for: 5m
        labels:
          severity: critical
          service: umoja-wazuh-integration
          compliance_domain: segregation_of_duties
        annotations:
          summary: UmojaFlowOS SoD incident-handler failure rate is high
          description: More than 10 percent of at least five handler invocations failed during the last 15 minutes.

      - alert: UmojaSodIncidentHandlerSilent
        expr: absent(umoja_sod_incident_requests_total)
        for: 15m
        labels:
          severity: warning
          service: umoja-wazuh-integration
        annotations:
          summary: UmojaFlowOS SoD incident-handler metrics are absent
          description: Prometheus cannot find the handler textfile metrics. Check the Wazuh manager mount and node-exporter collector.

      - alert: UmojaLedgerReconciliationDiscrepancy
        expr: umoja_ledger_reconciliation_last_run_status{status="discrepancy"} == 1
        for: 0m
        labels:
          severity: critical
          service: ledger-reconciliation
          compliance_domain: ledger_integrity
        annotations:
          summary: UmojaFlowOS ledger reconciliation discrepancy
          description: The latest TigerBeetle/PostgreSQL reconciliation run recorded one or more discrepancies.
          runbook_url: https://docs.example.invalid/runbooks/tigerbeetle-reconciliation

      - alert: UmojaLedgerReconciliationIndeterminate
        expr: umoja_ledger_reconciliation_last_run_status{status="indeterminate"} == 1
        for: 0m
        labels:
          severity: critical
          service: ledger-reconciliation
          compliance_domain: ledger_integrity
        annotations:
          summary: UmojaFlowOS ledger reconciliation is indeterminate
          description: The latest reconciliation could not establish ledger consistency; do not treat the period as reconciled.
          runbook_url: https://docs.example.invalid/runbooks/tigerbeetle-reconciliation

      - alert: UmojaLedgerReconciliationDiscrepancyCount
        expr: umoja_ledger_reconciliation_last_discrepancy_count > 0
        for: 0m
        labels:
          severity: critical
          service: ledger-reconciliation
          compliance_domain: ledger_integrity
        annotations:
          summary: UmojaFlowOS reconciliation discrepancy count is nonzero
          description: The latest reconciliation contains {{ $value }} discrepancy record(s).

      - alert: UmojaLedgerReconciliationStale
        expr: time() - umoja_ledger_reconciliation_last_run_timestamp_seconds > 4500
        for: 15m
        labels:
          severity: critical
          service: ledger-reconciliation
          compliance_domain: ledger_integrity
        annotations:
          summary: UmojaFlowOS ledger reconciliation is stale
          description: No successful reconciliation metric update has been observed within the expected hourly schedule plus grace period.

      - alert: UmojaTigerBeetleConsensusLoss
        expr: umoja_tigerbeetle_failover_state{state="indeterminate"} == 1
        for: 0m
        labels:
          severity: critical
          urgency: page
          service: tigerbeetle-failover
          compliance_domain: ledger_integrity
        annotations:
          summary: UmojaFlowOS TigerBeetle failover is indeterminate
          description: Consensus, fencing, quorum, promotion, or reconciliation has not been proven. Freeze live transaction processing.
          runbook_url: https://docs.example.invalid/runbooks/tigerbeetle-consensus-loss

      - alert: UmojaTigerBeetleFailoverIndeterminate
        expr: time() - umoja_tigerbeetle_failover_last_event_timestamp_seconds > 900 and umoja_tigerbeetle_failover_state{state="indeterminate"} == 1
        for: 0m
        labels:
          severity: critical
          urgency: page
          service: tigerbeetle-failover
          compliance_domain: ledger_integrity
        annotations:
          summary: UmojaFlowOS TigerBeetle failover remains indeterminate
          description: The failover state has remained unresolved for more than 15 minutes; maintain the transaction freeze and escalate.
          runbook_url: https://docs.example.invalid/runbooks/tigerbeetle-consensus-loss

      - alert: UmojaTigerBeetleLoadTestErrorSpike
        expr: |
          increase(umoja_tigerbeetle_loadtest_failures_total[5m]) > 0
          or (
            increase(umoja_tigerbeetle_loadtest_failures_total[15m])
            /
            clamp_min(increase(umoja_tigerbeetle_loadtest_requests_total[15m]), 1)
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          urgency: page
          service: tigerbeetle-loadtest
          environment: staging
          compliance_domain: ledger_integrity
        annotations:
          summary: TigerBeetle staging load test error spike
          description: One or more batch failures or an error ratio above 1 percent was observed during the staging load test.
          runbook_url: https://docs.example.invalid/runbooks/tigerbeetle-loadtest

      - alert: UmojaTigerBeetleLoadTestP95LatencyHigh
        expr: umoja_tigerbeetle_loadtest_latency_ms{quantile="0.95"} > 250
        for: 5m
        labels:
          severity: warning
          service: tigerbeetle-loadtest
          environment: staging
          compliance_domain: ledger_integrity
        annotations:
          summary: TigerBeetle staging load-test p95 latency is high
          description: The p95 batch-transfer latency has exceeded 250 milliseconds for five minutes.

      - alert: UmojaTigerBeetleLoadTestP99LatencyCritical
        expr: umoja_tigerbeetle_loadtest_latency_ms{quantile="0.99"} > 1000
        for: 2m
        labels:
          severity: critical
          urgency: page
          service: tigerbeetle-loadtest
          environment: staging
          compliance_domain: ledger_integrity
        annotations:
          summary: TigerBeetle staging load-test p99 latency is critical
          description: The p99 batch-transfer latency has exceeded one second. Stop the test and investigate replica health and network latency.
          runbook_url: https://docs.example.invalid/runbooks/tigerbeetle-loadtest

      - alert: UmojaTigerBeetleLoadTestThroughputCollapse
        expr: umoja_tigerbeetle_loadtest_transfers_per_second < 1
        for: 5m
        labels:
          severity: critical
          urgency: page
          service: tigerbeetle-loadtest
          environment: staging
          compliance_domain: ledger_integrity
        annotations:
          summary: TigerBeetle staging load-test throughput collapsed
          description: The load-test transfer throughput is below one transfer per second for five minutes.
