global:
  resolve_timeout: 5m

route:
  receiver: umoja-signer-warning-slack
  group_by: [alertname, service, component, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname="UmojaTigerBeetleQuorumLost"
        - severity="critical"
      receiver: umoja-tigerbeetle-critical-pagerduty
      group_wait: 10s
      repeat_interval: 30m
      continue: false
    - matchers:
        - alertname="UmojaTigerBeetleReplicationLagHigh"
        - severity="critical"
      receiver: umoja-tigerbeetle-critical-pagerduty
      group_wait: 10s
      repeat_interval: 30m
      continue: false
    - matchers:
        - service="payment-engine"
        - component="mojaloop-signer"
        - severity="critical"
      receiver: umoja-signer-critical-pagerduty
      group_wait: 10s
      continue: false
    - matchers:
        - service="payment-engine"
        - component="mojaloop-signer"
        - severity="warning"
      receiver: umoja-signer-warning-slack
      continue: false

inhibit_rules:
  - source_matchers:
      - service="payment-engine"
      - component="mojaloop-signer"
      - severity="critical"
    target_matchers:
      - service="payment-engine"
      - component="mojaloop-signer"
      - alertname="UmojaMojaloopSignerRetryPressure"
      - severity="warning"
    equal:
      - service
      - component
      - environment

receivers:
  - name: umoja-tigerbeetle-critical-pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-routing-key
        severity: critical
        class: tigerbeetle-ledger
        component: payment-engine
        group: ledger-integrity
        description: '{{ .CommonAnnotations.summary }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          service: '{{ .CommonLabels.service }}'
          environment: '{{ .CommonLabels.environment }}'
          action: '{{ .CommonLabels.action }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
          description: '{{ .CommonAnnotations.description }}'
  - name: umoja-signer-critical-pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-routing-key
        severity: critical
        class: mojaloop-signer
        component: payment-engine
        group: mojaloop-signer
        description: '{{ .CommonAnnotations.summary }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          service: '{{ .CommonLabels.service }}'
          component: '{{ .CommonLabels.component }}'
          environment: '{{ .CommonLabels.environment }}'
          runbook: '{{ .CommonAnnotations.runbook }}'
          description: '{{ .CommonAnnotations.description }}'

  - name: umoja-signer-warning-slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        channel: '#umoja-signer-alerts'
        username: alertmanager
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ .CommonAnnotations.summary }}
          service={{ .CommonLabels.service }}
          component={{ .CommonLabels.component }}
          severity={{ .CommonLabels.severity }}
          runbook={{ .CommonAnnotations.runbook }}
          {{ .CommonAnnotations.description }}
