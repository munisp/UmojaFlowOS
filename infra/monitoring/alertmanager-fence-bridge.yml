# Alertmanager route fragment for the external signed fence-command bridge.
# Merge this route and receiver into the production Alertmanager configuration.
route:
  routes:
    - matchers:
        - alertname=~"UmojaOPAEvaluationTimeouts|UmojaOPAEvaluationFailuresByClass|UmojaOPARetryExhaustion|UmojaOPAIntegrityTelemetryAbsent"
        - severity="critical"
        - action="hold_settlement"
      receiver: umoja-signed-fence-bridge
      group_by: [alertname, service, environment, compliance_domain]
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 5m
      continue: true

receivers:
  - name: umoja-signed-fence-bridge
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/umoja-fence-bridge/url
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/umoja-fence-bridge/token
          tls_config:
            ca_file: /etc/alertmanager/secrets/umoja-fence-bridge/ca.crt
            cert_file: /etc/alertmanager/secrets/umoja-fence-bridge/client.crt
            key_file: /etc/alertmanager/secrets/umoja-fence-bridge/client.key
            insecure_skip_verify: false

inhibit_rules:
  - source_matchers:
      - alertname="UmojaOPAIntegrityTelemetryAbsent"
      - severity="critical"
    target_matchers:
      - service="opa"
      - severity=~"warning|critical"
    equal: [environment]
