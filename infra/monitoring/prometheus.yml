global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/mojaloop-signer-alerts.yml

scrape_configs:
  - job_name: payment-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-engine:8081"]
        labels:
          service: payment-engine
          environment: local
