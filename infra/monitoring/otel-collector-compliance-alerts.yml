groups:
  - name: umoja-otel-compliance
    rules:
      - alert: UmojaOTelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
          service: otel-collector
          compliance_impact: high
          environment: "{{ $labels.environment }}"
        annotations:
          summary: "OpenTelemetry Collector is unavailable"
          description: "Collector scrape is down; telemetry-dependent compliance and settlement controls are not observable."
          runbook_url: "https://github.com/munisp/UmojaFlowOS/blob/main/docs/otel_tempo_prometheus_alertmanager_staging_runbook.md"
      - alert: UmojaOTelExportFailures
        expr: sum(rate(otelcol_exporter_send_failed_spans[5m])) + sum(rate(otelcol_exporter_send_failed_metric_points[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: otel-collector
          compliance_impact: high
          environment: staging
        annotations:
          summary: "OpenTelemetry exports are failing"
          description: "Collector is failing to export traces or metrics; affected paths must remain fail-closed."
          runbook_url: "https://github.com/munisp/UmojaFlowOS/blob/main/docs/otel_tempo_prometheus_alertmanager_staging_runbook.md"
      - alert: UmojaComplianceTelemetryMissing
        expr: sum(otelcol_receiver_refused_spans) > 0 or sum(otelcol_receiver_refused_metric_points) > 0
        for: 2m
        labels:
          severity: critical
          service: otel-collector
          compliance_impact: high
          environment: staging
        annotations:
          summary: "Compliance telemetry is being refused"
          description: "Collector is refusing telemetry; do not represent the affected control as observable."
          runbook_url: "https://github.com/munisp/UmojaFlowOS/blob/main/docs/otel_tempo_prometheus_alertmanager_staging_runbook.md"
      - alert: UmojaCriticalComplianceAlert
        expr: count(ALERTS{alertstate="firing",severity="critical",compliance_impact="high"}) > 0
        for: 30s
        labels:
          severity: critical
          service: compliance-control-plane
          compliance_impact: high
          environment: staging
        annotations:
          summary: "Critical compliance control is firing"
          description: "A critical compliance or ledger-integrity alert is active and requires controlled response."
          runbook_url: "https://github.com/munisp/UmojaFlowOS/blob/main/docs/tigerbeetle_split_brain_incident_response_playbook.md"
