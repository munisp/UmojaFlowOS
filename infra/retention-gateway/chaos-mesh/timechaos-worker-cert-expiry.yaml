apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: umoja-retention-worker-cert-expiry
  namespace: security
  labels:
    app.kubernetes.io/name: umoja-retention-worker
    umoja.io/test: certificate-expiry
spec:
  mode: all
  selector:
    namespaces:
      - security
    labelSelectors:
      app.kubernetes.io/name: umoja-retention-worker
  timeOffset: 8760h
  clockIds:
    - CLOCK_REALTIME
  duration: 90s
