apiVersion: v1
kind: ServiceAccount
metadata:
  name: umoja-retention-synthetic-monitor
  namespace: security
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umoja-retention-synthetic-monitor
  namespace: security
  labels:
    app.kubernetes.io/name: umoja-retention-synthetic-monitor
    app.kubernetes.io/part-of: umojaflowos-retention
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umoja-retention-synthetic-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umoja-retention-synthetic-monitor
        app.kubernetes.io/part-of: umojaflowos-retention
    spec:
      serviceAccountName: umoja-retention-synthetic-monitor
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: ghcr.io/munisp/umojaflowos-retention-synthetic-monitor:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: RETENTION_WORKER_METRICS_URL
              value: http://umoja-retention-worker.security.svc.cluster.local:8080/metrics
            - name: SYNTHETIC_PROBE_INTERVAL_SECONDS
              value: "15"
            - name: SYNTHETIC_PROBE_TIMEOUT_SECONDS
              value: "5"
            - name: SYNTHETIC_PROMETHEUS_PORT
              value: "9468"
          ports:
            - name: metrics
              containerPort: 9468
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: umoja-retention-synthetic-monitor
  namespace: security
  labels:
    app.kubernetes.io/name: umoja-retention-synthetic-monitor
spec:
  selector:
    app.kubernetes.io/name: umoja-retention-synthetic-monitor
  ports:
    - name: metrics
      port: 9468
      targetPort: metrics
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umoja-retention-synthetic-monitor-default-deny
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umoja-retention-synthetic-monitor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9468
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: umoja-retention-worker
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
