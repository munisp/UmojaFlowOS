apiVersion: v1
kind: ConfigMap
metadata:
  name: umoja-retention-worker-metrics-fixture
  namespace: security
data:
  metrics: |
    # TYPE umoja_retention_worker_health gauge
    umoja_retention_worker_health 1
    # TYPE umoja_retention_worker_db_circuit_state gauge
    umoja_retention_worker_db_circuit_state 0
    # TYPE umoja_retention_worker_requests_total counter
    umoja_retention_worker_requests_total{operation="delete"} 0
    # TYPE umoja_retention_worker_results_total counter
    umoja_retention_worker_results_total{result="database_connection_pool_saturated"} 0
    umoja_retention_worker_results_total{result="database_claim_error"} 0
    umoja_retention_worker_results_total{result="database_circuit_open"} 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umoja-retention-worker-metrics-fixture
  namespace: security
  labels:
    app.kubernetes.io/name: umoja-retention-worker
    app.kubernetes.io/part-of: umojaflowos-retention-kind-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umoja-retention-worker
      app.kubernetes.io/part-of: umojaflowos-retention-kind-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umoja-retention-worker
        app.kubernetes.io/part-of: umojaflowos-retention-kind-fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metrics-fixture
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: metrics
              mountPath: /usr/share/nginx/html/metrics
              subPath: metrics
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
      volumes:
        - name: metrics
          configMap:
            name: umoja-retention-worker-metrics-fixture
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: umoja-retention-worker
  namespace: security
  labels:
    app.kubernetes.io/name: umoja-retention-worker
spec:
  selector:
    app.kubernetes.io/name: umoja-retention-worker
    app.kubernetes.io/part-of: umojaflowos-retention-kind-fixture
  ports:
    - name: http
      port: 8080
      targetPort: http
