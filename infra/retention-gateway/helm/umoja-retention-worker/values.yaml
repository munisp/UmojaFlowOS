replicaCount: 2

image:
  repository: ghcr.io/munisp/umojaflowos-retention-worker
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: umoja-retention-worker
  automountServiceAccountToken: false

service:
  port: 8080

opensearch:
  url: https://opensearch.security.svc.cluster.local:9200
  tlsSecretName: umoja-retention-opensearch-client-tls
  caKey: ca.crt
  certKey: tls.crt
  keyKey: tls.key

secrets:
  # Provision with External Secrets, SOPS, or an approved secret manager.
  workerCredentialsSecretName: umoja-retention-worker-secrets
  workerDatabaseUrlKey: RETENTION_WORKER_DATABASE_URL
  workerBearerTokenKey: RETENTION_WORKER_BEARER_TOKEN
  gatewayHmacSecretName: umoja-retention-gateway-hmac
  gatewayHmacKey: hmac
  manifestHmacSecretName: umoja-retention-manifest-hmac
  manifestHmacKey: hmac

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

databasePool:
  minSize: 2
  maxSize: 10
  timeoutSeconds: 2
  circuitFailureThreshold: 3
  circuitResetSeconds: 30
  statementTimeoutMs: 5000
  lockTimeoutMs: 1500
  idleTransactionTimeoutMs: 10000

networkPolicy:
  enabled: true
  postgresSelector:
    app.kubernetes.io/name: postgres
  opensearchSelector:
    app.kubernetes.io/name: opensearch
