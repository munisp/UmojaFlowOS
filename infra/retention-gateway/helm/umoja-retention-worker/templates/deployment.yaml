apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umoja-retention-worker.fullname" . }}
  labels:
    {{- include "umoja-retention-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "umoja-retention-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "umoja-retention-worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "umoja-retention-worker.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.workerCredentialsSecretName }}
                  key: {{ .Values.secrets.workerDatabaseUrlKey }}
            - name: RETENTION_WORKER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.workerCredentialsSecretName }}
                  key: {{ .Values.secrets.workerBearerTokenKey }}
            - name: OPENSEARCH_URL
              value: {{ .Values.opensearch.url | quote }}
            - name: OPENSEARCH_CA_FILE
              value: /var/run/secrets/opensearch/ca.crt
            - name: OPENSEARCH_CLIENT_CERT_FILE
              value: /var/run/secrets/opensearch/tls.crt
            - name: OPENSEARCH_CLIENT_KEY_FILE
              value: /var/run/secrets/opensearch/tls.key
            - name: RETENTION_GATEWAY_HMAC_SECRET_FILE
              value: /var/run/secrets/retention-gateway/hmac
            - name: RETENTION_MANIFEST_HMAC_SECRET_FILE
              value: /var/run/secrets/retention-manifest/hmac
            - name: RETENTION_DB_POOL_MIN_SIZE
              value: {{ .Values.databasePool.minSize | quote }}
            - name: RETENTION_DB_POOL_MAX_SIZE
              value: {{ .Values.databasePool.maxSize | quote }}
            - name: RETENTION_DB_POOL_TIMEOUT_SECONDS
              value: {{ .Values.databasePool.timeoutSeconds | quote }}
            - name: RETENTION_DB_CIRCUIT_FAILURE_THRESHOLD
              value: {{ .Values.databasePool.circuitFailureThreshold | quote }}
            - name: RETENTION_DB_CIRCUIT_RESET_SECONDS
              value: {{ .Values.databasePool.circuitResetSeconds | quote }}
            - name: RETENTION_DB_STATEMENT_TIMEOUT_MS
              value: {{ .Values.databasePool.statementTimeoutMs | quote }}
            - name: RETENTION_DB_LOCK_TIMEOUT_MS
              value: {{ .Values.databasePool.lockTimeoutMs | quote }}
            - name: RETENTION_DB_IDLE_TRANSACTION_TIMEOUT_MS
              value: {{ .Values.databasePool.idleTransactionTimeoutMs | quote }}
          volumeMounts:
            - name: opensearch-tls
              mountPath: /var/run/secrets/opensearch
              readOnly: true
            - name: retention-gateway-hmac
              mountPath: /var/run/secrets/retention-gateway
              readOnly: true
            - name: retention-manifest-hmac
              mountPath: /var/run/secrets/retention-manifest
              readOnly: true
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: opensearch-tls
          secret:
            secretName: {{ .Values.opensearch.tlsSecretName }}
            items:
              - {key: {{ .Values.opensearch.caKey }}, path: ca.crt}
              - {key: {{ .Values.opensearch.certKey }}, path: tls.crt}
              - {key: {{ .Values.opensearch.keyKey }}, path: tls.key}
        - name: retention-gateway-hmac
          secret:
            secretName: {{ .Values.secrets.gatewayHmacSecretName }}
            items: [{key: {{ .Values.secrets.gatewayHmacKey }}, path: hmac}]
        - name: retention-manifest-hmac
          secret:
            secretName: {{ .Values.secrets.manifestHmacSecretName }}
            items: [{key: {{ .Values.secrets.manifestHmacKey }}, path: hmac}]
