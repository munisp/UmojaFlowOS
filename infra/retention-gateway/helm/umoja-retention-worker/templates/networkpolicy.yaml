{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "umoja-retention-worker.fullname" . }}
  labels:
    {{- include "umoja-retention-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "umoja-retention-worker.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.postgresSelector | nindent 14 }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.opensearchSelector | nindent 14 }}
      ports: [{protocol: TCP, port: 9200}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
