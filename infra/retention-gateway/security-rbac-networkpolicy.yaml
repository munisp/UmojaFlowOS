apiVersion: v1
kind: ServiceAccount
metadata:
  name: umoja-retention-worker
  namespace: security
  labels:
    app.kubernetes.io/name: umoja-retention-worker
automountServiceAccountToken: false
---
# The worker does not use the Kubernetes API. Keeping this Role unbound makes
# the absence of API permissions explicit and reviewable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: umoja-retention-worker-no-api-access
  namespace: security
rules: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umoja-retention-worker-default-deny
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umoja-retention-worker
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umoja-retention-worker-ingress
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umoja-retention-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchLabels:
              app.kubernetes.io/name: umoja-retention-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umoja-retention-worker-egress
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umoja-retention-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow-retention-worker
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: umoja-retention-worker
      ports:
        - protocol: TCP
          port: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-retention-worker
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: umoja-retention-worker
      ports:
        - protocol: TCP
          port: 5432
