groups:
  - name: umoja-retention-worker-loadtest
    rules:
      - alert: UmojaRetentionLocustP95LatencySpike
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (le, scenario) (
                rate(umoja_locust_request_duration_seconds_bucket[5m])
              )
            ) > 5
          )
          and on () (max(umoja_locust_test_running) == 1)
        for: 3m
        labels:
          severity: warning
          service: retention-worker-loadtest
          compliance_domain: audit_retention
          environment: staging
        annotations:
          summary: Retention worker Locust p95 latency spike
          description: "Locust p95 request latency exceeded 5 seconds for scenario {{ $labels.scenario }} while a regression test was active. Compare worker latency and PostgreSQL lock waits before raising capacity."
          runbook_url: https://docs.example.invalid/runbooks/retention-worker-postgres-lock-loadtest

      - alert: UmojaRetentionPostgresLockWaitCritical
        expr: |
          (max(pg_retention_lock_wait_max_wait_seconds{environment="staging"}) > 2)
          and on () (max(umoja_locust_test_running) == 1)
        for: 2m
        labels:
          severity: critical
          urgency: page
          service: retention-worker-loadtest
          compliance_domain: audit_retention
          environment: staging
        annotations:
          summary: PostgreSQL lock wait exceeded two seconds during retention load test
          description: "The longest PostgreSQL lock wait exceeded 2 seconds while Locust was active. Stop the regression test, inspect pg_stat_activity, and reconcile authorization claims."
          runbook_url: https://docs.example.invalid/runbooks/retention-worker-postgres-lock-loadtest

      - alert: UmojaRetentionPostgresLockWaitersHigh
        expr: |
          (max(pg_retention_lock_wait_waiting_sessions{environment="staging"}) >= 5)
          and on () (max(umoja_locust_test_running) == 1)
        for: 2m
        labels:
          severity: warning
          service: retention-worker-loadtest
          compliance_domain: audit_retention
          environment: staging
        annotations:
          summary: PostgreSQL lock contention increased during retention load test
          description: "Five or more sessions are waiting on PostgreSQL locks while Locust is active. Evaluate the single-digest contention profile and database capacity."
