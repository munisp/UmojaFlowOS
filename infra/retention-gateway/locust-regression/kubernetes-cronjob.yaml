---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umoja-retention-loadtest
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umoja-retention-loadtest
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: 9646}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: umoja-retention-worker}
      ports: [{protocol: TCP, port: 8443}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
