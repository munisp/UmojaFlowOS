;; UmojaFlowOS PgBouncer — transaction pooling for all control-plane services.
;; Millisecond-latency rule: pool checkout must be <1ms p99; never let app
;; services open per-request connections to PostgreSQL.
[databases]
umojaflowos = host=postgres.internal port=5432 dbname=umojaflowos

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction          ;; required for connection reuse at ms scale
max_client_conn = 2000
default_pool_size = 40           ;; ~ (2 × vCPU) per service role
min_pool_size = 10               ;; warm pool — cold connects cost 5-15ms
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 180         ;; stays under postgres max_connections=200

server_lifetime = 1800
server_idle_timeout = 600
server_connect_timeout = 5
query_wait_timeout = 5           ;; fail fast — a queued query is a missed SLO
client_login_timeout = 5

;; prepared statements break transaction pooling unless enabled here
max_prepared_statements = 256

;; health & observability
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
log_connections = 0
log_disconnections = 0
