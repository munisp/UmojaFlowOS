# UmojaFlowOS PostgreSQL tuning — drop into postgresql.conf.d/ (include_dir).
# Baseline: 8 vCPU / 32 GB RAM control-plane node, NVMe storage.
# Goal: sub-10ms p99 single-row lookups, sub-50ms p99 worker polls.
# Every setting is conservative; raise only with benchmarks in artifacts/benchmarks.

# ---- memory -----------------------------------------------------------------
shared_buffers = 8GB                    # 25% of RAM; page cache does the rest
effective_cache_size = 24GB             # ~75% of RAM, planner cost model
work_mem = 64MB                         # per-sort/hash; keep low — many conns
maintenance_work_mem = 1GB              # VACUUM/CREATE INDEX speed
huge_pages = try

# ---- connections (pair with PgBouncer transaction pooling) -------------------
max_connections = 200                   # real concurrency lives in PgBouncer
superuser_reserved_connections = 5

# ---- WAL & checkpointing (durability unchanged; spread I/O) ------------------
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# ---- planner (NVMe: random reads ~ as cheap as sequential) -------------------
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off                               # ms-latency OLTP; JIT compile cost dominates

# ---- parallelism -------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---- autovacuum (outbox/inbox are churn-heavy append tables) -----------------
autovacuum = on
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# ---- logging (feed the SLO dashboards; keep overhead <1%) --------------------
log_min_duration_statement = 250        # only queries slower than 250ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
