# FalkorDB graph store for the operational knowledge graph (GraphRAG target).
# Sparse-matrix (GraphBLAS) engine on the Redis stack; openCypher over RESP.
# Loaded by umojaflowos_ml.falkordb_export from CocoIndex KG flows.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"   # RESP (mapped off the platform Redis port)
      - "3001:3000"   # browser UI
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
