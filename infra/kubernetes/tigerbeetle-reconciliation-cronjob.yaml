---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umoja-ledger-reconciliation-metrics
  namespace: security
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tigerbeetle-postgres-reconciliation
  namespace: security
  labels:
    app.kubernetes.io/name: tigerbeetle-postgres-reconciliation
    app.kubernetes.io/component: financial-controls
spec:
  schedule: "0 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tigerbeetle-postgres-reconciliation
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciliation
              image: ghcr.io/munisp/umojaflowos-reconciliation@sha256:replace-with-reviewed-digest
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/opt/umoja/scripts/infra/reconcile_tigerbeetle_postgres.sh"]
              env:
                - name: AUDIT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: umoja-ledger-reconciliation
                      key: database-url
                - name: RECONCILIATION_SOURCE_IDENTITY
                  valueFrom:
                    secretKeyRef:
                      name: umoja-ledger-reconciliation
                      key: source-identity
                - name: POSTGRES_CONNECT_TIMEOUT_SECONDS
                  value: "10"
                - name: RECONCILIATION_METRICS_PATH
                  value: /var/lib/node_exporter/textfile_collector/umoja_ledger_reconciliation.prom
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              ports: []
              volumeMounts:
                - name: reconciliation-metrics
                  mountPath: /var/lib/node_exporter/textfile_collector
          volumes:
            - name: reconciliation-metrics
              persistentVolumeClaim:
                claimName: umoja-ledger-reconciliation-metrics
