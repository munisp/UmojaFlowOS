apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-engine
  namespace: umoja-payment
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-engine
        app.kubernetes.io/component: payment-engine
        app.kubernetes.io/part-of: umojaflowos
      annotations:
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/includeInboundPorts: "8081,8443"
        traffic.sidecar.istio.io/includeOutboundPorts: "443,5432,6379,8443"
    spec:
      containers:
        - name: payment-engine
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: grpc-tls
              containerPort: 8443
              protocol: TCP
          env:
            - name: GRPC_SETTLEMENT_LISTEN_ADDR
              value: ":8443"
            - name: GRPC_SETTLEMENT_EXECUTION_ENABLED
              value: "false"
            - name: GRPC_SETTLEMENT_CA_FILE
              value: /var/run/umoja-settlement-grpc/ca.crt
            - name: GRPC_SETTLEMENT_CERT_FILE
              value: /var/run/umoja-settlement-grpc/tls.crt
            - name: GRPC_SETTLEMENT_KEY_FILE
              value: /var/run/umoja-settlement-grpc/tls.key
            - name: GRPC_SETTLEMENT_SERVER_NAME
              value: payment-engine.umoja-payment.svc.cluster.local
            - name: OTEL_SERVICE_NAME
              value: payment-engine
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=umojaflowos,deployment.environment=staging
          volumeMounts:
            - name: settlement-grpc-server-mtls
              mountPath: /var/run/umoja-settlement-grpc
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: grpc-tls
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: settlement-grpc-server-mtls
          secret:
            secretName: settlement-grpc-server-mtls
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
                mode: 0400
              - key: tls.key
                path: tls.key
                mode: 0400
              - key: ca.crt
                path: ca.crt
                mode: 0444
