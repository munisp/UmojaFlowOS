---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umoja-anti-wipe-manifest
  namespace: security
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: umojaflowos-anti-wipe-verification
  namespace: security
  labels:
    app.kubernetes.io/name: umojaflowos-anti-wipe-verification
    app.kubernetes.io/component: financial-controls
spec:
  # Every 15 minutes; wipe/tamper detection must be near-real-time.
  schedule: "*/15 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 24  # keep failure evidence — a failed verify IS the alert
  jobTemplate:
    spec:
      backoffLimit: 0  # fail fast, fail closed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: umojaflowos-anti-wipe-verification
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: anti-wipe
              image: python:3.12-slim
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: repo
                  mountPath: /opt/umojaflowos
                  readOnly: true  # the verifier can never modify what it guards
                - name: manifest
                  mountPath: /var/lib/umojaflowos/anti-wipe
              command:
                - python3
                - /opt/umojaflowos/scripts/infra/filesystem_anti_wipe.py
                - verify
                - --root
                - /opt/umojaflowos
                - --config
                - /opt/umojaflowos/infra/anti-wipe/protected-paths.json
                - --manifest
                - /var/lib/umojaflowos/anti-wipe/manifest.json
                - --log
                - /var/lib/umojaflowos/anti-wipe/anti-wipe-audit.jsonl
          volumes:
            - name: repo
              persistentVolumeClaim:
                claimName: umojaflowos-repo-snapshot  # content-addressed deploy snapshot
                readOnly: true
            - name: manifest
              persistentVolumeClaim:
                claimName: umoja-anti-wipe-manifest
