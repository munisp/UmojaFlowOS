services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME must be supplied by the deployment secret store}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD must be supplied by the deployment secret store}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be supplied by the deployment secret store}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be supplied by the deployment secret store}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  evidence-gateway:
    build:
      context: ../../
      dockerfile: services/evidence-gateway/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      OIDC_ISSUER: http://keycloak:8080/realms/umoja
      OIDC_AUDIENCE: umoja-evidence-publisher
      OIDC_REQUIRED_ROLE: evidence.publish
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: umoja-evidence-local
      S3_PREFIX: umoja/releases
      S3_RETENTION_DAYS: 1
      ENSURE_BUCKET_CONFIG: "true"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be supplied by the deployment secret store}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be supplied by the deployment secret store}
      RELEASE_MAPPING_FILE: /config/release-mapping.json
    volumes:
      - ./release-mapping.json:/config/release-mapping.json:ro
    ports:
      - "127.0.0.1:8280:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  minio-data:
