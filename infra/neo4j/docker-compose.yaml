# Neo4j graph store for mule-network investigation and GDS analytics.
# Loaded by umojaflowos_ml.neo4j_export from the Lakehouse gold graph snapshot.
services:
  neo4j:
    image: neo4j:5.26-enterprise
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
