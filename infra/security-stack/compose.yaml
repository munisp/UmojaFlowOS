name: umojaflowos-security-stack

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      apisix:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      payment-engine:
        condition: service_healthy
    environment:
      UMOJA_PUBLIC_HOST: ${UMOJA_PUBLIC_HOST:?set a real public hostname}
      UMOJA_TLS_CONTACT_EMAIL: ${UMOJA_TLS_CONTACT_EMAIL:?set the certificate contact email}
      UMOJA_APISIX_UPSTREAM: http://apisix:9080
      UMOJA_CONTROL_PLANE_UPSTREAM: http://control-plane:3000
    ports:
      - "${UMOJA_HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
      protected:
        aliases:
          - ${UMOJA_PUBLIC_HOST:?set a real public hostname}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

  apisix:
    image: apache/apisix:3.10.0-debian
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      UMOJA_REDIS_HOST: redis
      UMOJA_REDIS_PASSWORD: ${UMOJA_REDIS_PASSWORD:?supply through a managed secret injector}
      KEYCLOAK_OIDC_DISCOVERY_URL: https://${UMOJA_PUBLIC_HOST}/realms/umojaflowos/.well-known/openid-configuration
      UMOJA_KEYCLOAK_CLIENT_SECRET: ${UMOJA_KEYCLOAK_CLIENT_SECRET:?supply through a managed secret injector}
      UMOJA_OPA_URL: https://opa:8181
    expose:
      - "9080"
    volumes:
      - ../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ${UMOJA_APISIX_TRUST_BUNDLE_PATH:?supply the private CA certificate through a managed secret injector}:/etc/ssl/certs/umoja-internal-ca.pem:ro
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /usr/local/apisix/logs
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  payment-engine:
    image: ${UMOJA_PAYMENT_ENGINE_IMAGE:?provide an immutable payment-engine image reference}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8081"
      UMOJA_YELLOWCARD_ENABLED: ${UMOJA_YELLOWCARD_ENABLED:-false}
      UMOJA_YELLOWCARD_ENVIRONMENT: ${UMOJA_YELLOWCARD_ENVIRONMENT:-sandbox}
      UMOJA_YELLOWCARD_TLS_REQUIRED: "true"
      UMOJA_YELLOWCARD_ALLOW_INSECURE_LOOPBACK: "false"
      UMOJA_YELLOWCARD_FAIL_CLOSED: "true"
      UMOJA_YELLOWCARD_WEBHOOK_ENABLED: ${UMOJA_YELLOWCARD_WEBHOOK_ENABLED:-false}
      UMOJA_YELLOWCARD_WEBHOOK_PUBLIC_URL: https://${UMOJA_PUBLIC_HOST}/webhooks/yellowcard
      UMOJA_YELLOWCARD_WEBHOOK_TLS_REQUIRED: "true"
      UMOJA_YELLOWCARD_WEBHOOK_FAIL_CLOSED: "true"
      UMOJA_YELLOWCARD_WEBHOOK_CAN_SETTLE: "false"
      UMOJA_YELLOWCARD_WEBHOOK_SIGNATURE_HEADER: X-YC-Signature
      UMOJA_YELLOWCARD_WEBHOOK_TIMESTAMP_HEADER: X-YC-Timestamp
      UMOJA_YELLOWCARD_WEBHOOK_MAX_AGE_SECONDS: "300"
      UMOJA_YELLOWCARD_WEBHOOK_BODY_MAX_BYTES: "262144"
      UMOJA_YELLOWCARD_WEBHOOK_ALLOWED_CIDRS: ${UMOJA_YELLOWCARD_WEBHOOK_ALLOWED_CIDRS:?supply the approved provider source CIDRs}
      UMOJA_YELLOWCARD_WEBHOOK_SECRET_REFERENCE: ${UMOJA_YELLOWCARD_WEBHOOK_SECRET_REFERENCE:?supply a managed file reference}
      UMOJA_YELLOWCARD_WEBHOOK_PREVIOUS_SECRET_REFERENCE: ${UMOJA_YELLOWCARD_WEBHOOK_PREVIOUS_SECRET_REFERENCE:-}
      UMOJA_PROVIDER_MATERIAL_ROOT: /run/umoja-secrets
      UMOJA_YELLOWCARD_REPLAY_REDIS_ADDRESS: redis:6379
      UMOJA_YELLOWCARD_REPLAY_REDIS_PASSWORD_SECRET_REFERENCE: ${UMOJA_YELLOWCARD_REPLAY_REDIS_PASSWORD_SECRET_REFERENCE:?supply a managed file reference}
      UMOJA_YELLOWCARD_REPLAY_REDIS_CA_BUNDLE_PATH: /run/umoja-tls/redis/ca.crt
      UMOJA_YELLOWCARD_REPLAY_KEY_PREFIX: "yellowcard:webhook:"
      UMOJA_YELLOWCARD_WEBHOOK_EVIDENCE_DIRECTORY: /var/lib/umojaflowos/webhook-evidence
      UMOJA_YELLOWCARD_WEBHOOK_RECONCILIATION_QUEUE_DIRECTORY: /var/lib/umojaflowos/webhook-reconciliation
      UMOJA_YELLOWCARD_EXECUTION_ENABLED: ${UMOJA_YELLOWCARD_EXECUTION_ENABLED:-false}
      UMOJA_YELLOWCARD_EXECUTION_BASE_URL: ${UMOJA_YELLOWCARD_EXECUTION_BASE_URL:-}
      UMOJA_YELLOWCARD_ALLOW_FORCE_ACCEPT: "false"
      UMOJA_YELLOWCARD_API_KEY_SECRET_REFERENCE: ${UMOJA_YELLOWCARD_API_KEY_SECRET_REFERENCE:-}
      UMOJA_YELLOWCARD_HMAC_SECRET_REFERENCE: ${UMOJA_YELLOWCARD_HMAC_SECRET_REFERENCE:-}
      UMOJA_YELLOWCARD_EXECUTION_APPROVAL_HMAC_SECRET_REFERENCE: ${UMOJA_YELLOWCARD_EXECUTION_APPROVAL_HMAC_SECRET_REFERENCE:-}
      UMOJA_TIGERBEETLE_ENABLED: ${UMOJA_TIGERBEETLE_ENABLED:-false}
      UMOJA_TIGERBEETLE_CLUSTER_ID: ${UMOJA_TIGERBEETLE_CLUSTER_ID:-}
      UMOJA_TIGERBEETLE_ADDRESSES: ${UMOJA_TIGERBEETLE_ADDRESSES:-}
      UMOJA_TIGERBEETLE_NGN_LEDGER: ${UMOJA_TIGERBEETLE_NGN_LEDGER:-}
      UMOJA_TIGERBEETLE_KES_LEDGER: ${UMOJA_TIGERBEETLE_KES_LEDGER:-}
      UMOJA_TIGERBEETLE_ZAR_LEDGER: ${UMOJA_TIGERBEETLE_ZAR_LEDGER:-}
      UMOJA_TIGERBEETLE_ACCOUNT_CODE: ${UMOJA_TIGERBEETLE_ACCOUNT_CODE:-}
      UMOJA_TIGERBEETLE_TRANSFER_CODE: ${UMOJA_TIGERBEETLE_TRANSFER_CODE:-}
      UMOJA_TIGERBEETLE_TLS_REQUIRED: "true"
      UMOJA_TIGERBEETLE_ALLOW_INSECURE_LOOPBACK: "false"
      UMOJA_LEDGER_PROJECTION_ENDPOINT: https://${UMOJA_PUBLIC_HOST}/internal/ledger/projections
      UMOJA_LEDGER_PROJECTION_HMAC_SECRET_REFERENCE: ${UMOJA_LEDGER_PROJECTION_HMAC_SECRET_REFERENCE:-}
      UMOJA_LEDGER_PROJECTION_ALLOW_INSECURE_LOOPBACK: "false"
    expose:
      - "8081"
    volumes:
      - ${UMOJA_YELLOWCARD_MATERIAL_MOUNT_PATH:?mount secret-manager material outside source control}:/run/umoja-secrets:ro
      - ${UMOJA_REDIS_TLS_MATERIAL_PATH:?supply Redis TLS material through a managed secret injector}:/run/umoja-tls/redis:ro
      - webhook-evidence:/var/lib/umojaflowos/webhook-evidence
      - webhook-reconciliation:/var/lib/umojaflowos/webhook-reconciliation
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  risk-compliance-core:
    image: ${UMOJA_RISK_CORE_IMAGE:?provide an immutable risk-compliance image reference}
    restart: unless-stopped
    environment:
      PORT: "8082"
      UMOJA_SCREENING_ENABLED: ${UMOJA_SCREENING_ENABLED:-false}
      UMOJA_SCREENING_ENDPOINT: ${UMOJA_SCREENING_ENDPOINT:-}
      UMOJA_SCREENING_API_KEY_SECRET_REFERENCE: ${UMOJA_SCREENING_API_KEY_SECRET_REFERENCE:-}
      UMOJA_SCREENING_MATERIAL_ROOT: /run/umoja-secrets
      UMOJA_SCREENING_ALLOW_INSECURE_LOOPBACK: "false"
    expose:
      - "8082"
    volumes:
      - ${UMOJA_SCREENING_MATERIAL_MOUNT_PATH:?mount screening secret-manager material outside source control}:/run/umoja-secrets:ro
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  reporting-analytics:
    image: ${UMOJA_REPORTING_IMAGE:?provide an immutable reporting image reference}
    restart: unless-stopped
    environment:
      UMOJA_REGULATORY_SUBMISSION_ENABLED: ${UMOJA_REGULATORY_SUBMISSION_ENABLED:-false}
      UMOJA_REGULATORY_SUBMISSION_ENDPOINT: ${UMOJA_REGULATORY_SUBMISSION_ENDPOINT:-}
      UMOJA_REGULATORY_SUBMISSION_CHANNEL_REFERENCE: ${UMOJA_REGULATORY_SUBMISSION_CHANNEL_REFERENCE:-}
      UMOJA_REGULATORY_SUBMISSION_API_KEY_SECRET_REFERENCE: ${UMOJA_REGULATORY_SUBMISSION_API_KEY_SECRET_REFERENCE:-}
      UMOJA_REGULATORY_SUBMISSION_MATERIAL_ROOT: /run/umoja-secrets
    expose:
      - "8083"
    volumes:
      - ${UMOJA_REGULATORY_SUBMISSION_MATERIAL_MOUNT_PATH:?mount regulatory-channel secret-manager material outside source control}:/run/umoja-secrets:ro
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8083/healthz\", timeout=2)' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  opa:
    image: openpolicyagent/opa:0.70.0-static
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--tls-cert-file=/run/umoja-tls/opa/tls.crt", "--tls-private-key-file=/run/umoja-tls/opa/tls.key", "/policies"]
    expose:
      - "8181"
    volumes:
      - ../opa:/policies:ro
      - ${UMOJA_OPA_TLS_MATERIAL_PATH:?supply OPA TLS material through a managed secret injector}:/run/umoja-tls/opa:ro
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "/opa", "eval", "--format=raw", "1"]
      interval: 15s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes", "--port", "0", "--tls-port", "6379", "--tls-cert-file", "/run/umoja-tls/redis/tls.crt", "--tls-key-file", "/run/umoja-tls/redis/tls.key", "--tls-ca-cert-file", "/run/umoja-tls/redis/ca.crt", "--tls-auth-clients", "no", "--requirepass", "${UMOJA_REDIS_PASSWORD:?supply through a managed secret injector}"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
      - ${UMOJA_REDIS_TLS_MATERIAL_PATH:?supply Redis TLS material through a managed secret injector}:/run/umoja-tls/redis:ro
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$UMOJA_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMOJA_CONTROL_POSTGRES_DATABASE:?set the control-plane PostgreSQL database name}
      POSTGRES_USER: ${UMOJA_CONTROL_POSTGRES_OWNER:?supply through a managed secret injector}
      POSTGRES_PASSWORD: ${UMOJA_CONTROL_POSTGRES_OWNER_PASSWORD:?supply through a managed secret injector}
      UMOJA_APP_DB_USER: ${UMOJA_APP_DB_USER:?supply the application principal through a managed secret injector}
      UMOJA_APP_DB_PASSWORD: ${UMOJA_APP_DB_PASSWORD:?supply through a managed secret injector}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      timeout: 3s
      retries: 5

  keycloak-postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMOJA_KEYCLOAK_POSTGRES_DATABASE:?set the Keycloak PostgreSQL database name}
      POSTGRES_USER: ${UMOJA_KEYCLOAK_POSTGRES_OWNER:?supply through a managed secret injector}
      POSTGRES_PASSWORD: ${UMOJA_KEYCLOAK_POSTGRES_OWNER_PASSWORD:?supply through a managed secret injector}
    expose:
      - "5432"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${UMOJA_KEYCLOAK_POSTGRES_DATABASE:?set the Keycloak PostgreSQL database name}
      KC_DB_USERNAME: ${UMOJA_KEYCLOAK_POSTGRES_OWNER:?supply through a managed secret injector}
      KC_DB_PASSWORD: ${UMOJA_KEYCLOAK_POSTGRES_OWNER_PASSWORD:?supply through a managed secret injector}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${UMOJA_KEYCLOAK_BOOTSTRAP_ADMIN:?supply through a managed secret injector}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${UMOJA_KEYCLOAK_BOOTSTRAP_PASSWORD:?supply through a managed secret injector}
      KC_HOSTNAME: ${UMOJA_PUBLIC_HOST:?set a real public hostname}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    expose:
      - "8080"
    volumes:
      - ../keycloak/realm-umojaflowos.json:/opt/keycloak/data/import/realm-umojaflowos.json:ro
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 3s
      retries: 8

  control-plane:
    image: ${UMOJA_CONTROL_PLANE_IMAGE:?provide an immutable control-plane image reference}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      POSTGRES_DATABASE_URL: postgresql://${UMOJA_APP_DB_USER:?supply through a managed secret injector}:${UMOJA_APP_DB_PASSWORD:?supply through a managed secret injector}@postgres:5432/${UMOJA_CONTROL_POSTGRES_DATABASE:?set the control-plane PostgreSQL database name}
      UMOJA_KEYCLOAK_ISSUER: https://${UMOJA_PUBLIC_HOST}/realms/umojaflowos
      UMOJA_KEYCLOAK_CLIENT_ID: ${UMOJA_KEYCLOAK_CLIENT_ID:?set the Keycloak client identifier}
      UMOJA_KEYCLOAK_AUDIENCE: ${UMOJA_KEYCLOAK_AUDIENCE:?set the Keycloak audience}
      UMOJA_KEYCLOAK_CLIENT_SECRET: ${UMOJA_KEYCLOAK_CLIENT_SECRET:?supply through a managed secret injector}
      UMOJA_PUBLIC_BASE_URL: https://${UMOJA_PUBLIC_HOST}
      UMOJA_SESSION_SECRET: ${UMOJA_SESSION_SECRET:?supply through a managed secret injector}
      UMOJA_OBJECT_STORAGE_ENDPOINT: ${UMOJA_OBJECT_STORAGE_ENDPOINT:?set the private S3-compatible endpoint}
      UMOJA_OBJECT_STORAGE_BUCKET: ${UMOJA_OBJECT_STORAGE_BUCKET:?set the approved evidence bucket}
      UMOJA_OBJECT_STORAGE_ACCESS_KEY_ID: ${UMOJA_OBJECT_STORAGE_ACCESS_KEY_ID:?supply through a managed secret injector}
      UMOJA_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${UMOJA_OBJECT_STORAGE_SECRET_ACCESS_KEY:?supply through a managed secret injector}
      UMOJA_LEDGER_PROJECTION_HMAC_SECRET_REFERENCE: ${UMOJA_LEDGER_PROJECTION_HMAC_SECRET_REFERENCE:-}
      UMOJA_PROVIDER_MATERIAL_ROOT: /run/umoja-secrets
      UMOJA_SOD_MONITOR_ENABLED: ${UMOJA_SOD_MONITOR_ENABLED:-false}
      UMOJA_SOD_MONITOR_INTERVAL_SECONDS: ${UMOJA_SOD_MONITOR_INTERVAL_SECONDS:-300}
      UMOJA_SOD_MONITOR_SUBJECT: ${UMOJA_SOD_MONITOR_SUBJECT:-system:sod-monitor}
      UMOJA_SOD_AUDIT_LOG_PATH: ${UMOJA_SOD_AUDIT_LOG_PATH:-/var/log/umoja/sod-audit.jsonl}
      UMOJA_SOD_LOCK_RETRY_ATTEMPTS: ${UMOJA_SOD_LOCK_RETRY_ATTEMPTS:-3}
      UMOJA_SOD_LOCK_RETRY_BACKOFF_MS: ${UMOJA_SOD_LOCK_RETRY_BACKOFF_MS:-250}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
      POSTGRES_LOCK_TIMEOUT_MS: ${POSTGRES_LOCK_TIMEOUT_MS:-5000}
    expose:
      - "3000"
    volumes:
      - ${UMOJA_YELLOWCARD_MATERIAL_MOUNT_PATH:?mount internal-control secret-manager material outside source control}:/run/umoja-secrets:ro
      - sod-audit:/var/log/umoja
    networks:
      - protected
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  edge:
    driver: bridge
  protected:
    driver: bridge
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  keycloak-postgres-data:
  redis-data:
  webhook-evidence:
  webhook-reconciliation:
  sod-audit:
