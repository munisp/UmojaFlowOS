namespaceOverride: security

wazuh:
  image:
    repository: wazuh/wazuh-manager
    tag: 4.12.0
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  endpoint:
    existingSecret: umoja-sod-incident
    key: endpoint
  hmacSecret:
    existingSecret: umoja-sod-incident
    key: hmac-secret
  incidentRules: "100810,100811,100820"
  metricsPath: /var/lib/node_exporter/textfile_collector/umoja_sod_incident.prom
  resources: {}

metrics:
  enabled: true
  pvc:
    name: umoja-sod-metrics
    accessModes: [ReadWriteOnce]
    size: 1Gi
    storageClassName: ""

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.9.1
    pullPolicy: IfNotPresent
  resources: {}

secret:
  create: false
  name: umoja-sod-incident
  endpoint: ""
  hmacSecret: ""

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s

prometheusRule:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
