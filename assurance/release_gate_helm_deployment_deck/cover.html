<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
*{box-sizing:border-box} body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#0b1324;color:#eef5f7;padding:72px 86px 0;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden;transform:translateY(-1px)}
.kicker{font-size:18px;letter-spacing:3px;color:#55d6c2;text-transform:uppercase;font-weight:700}
.title{font-size:58px;line-height:1.05;max-width:690px;margin-top:28px;font-weight:800;letter-spacing:-1px}
.subtitle{font-size:24px;line-height:1.35;color:#b9c8d0;max-width:650px;margin-top:24px}
.byline{position:absolute;left:86px;bottom:70px;color:#a9bac3;font-size:16px;line-height:1.55}
.byline strong{color:#eef5f7}
.motif{position:absolute;right:116px;top:132px;width:390px;height:390px;border:1px solid #28465a;transform:rotate(45deg)}
.motif:before,.motif:after{content:"";position:absolute;inset:48px;border:1px solid #2c6970}
.motif:after{inset:112px;background:#55d6c2;border:0;opacity:.9}
.node{position:absolute;width:58px;height:58px;border:2px solid #55d6c2;border-radius:50%;background:#0b1324;z-index:2}
.n1{left:35px;top:160px}.n2{right:35px;top:160px}.n3{left:160px;top:35px}.n4{left:160px;bottom:35px}
.node span{display:block;width:10px;height:10px;background:#55d6c2;border-radius:50%;margin:22px auto}
.rule{position:absolute;left:86px;top:54px;width:84px;height:4px;background:#55d6c2}
.footer{position:absolute;right:86px;bottom:70px;font-size:14px;color:#607887;letter-spacing:1px}
</style>
</head>
<body>
<div class="slide-container">
  <div class="rule"></div>
  <div class="kicker">UmojaFlowOS · Production Controls</div>
  <div class="title">Multi-Replica Release Gate &amp; Helm Deployment</div>
  <div class="subtitle">Four-role Ed25519 approval enforcement for fail-closed payment-engine operations.</div>
  <div class="byline"><strong>Stakeholder briefing</strong><br/>Architecture · Security · Operations · Regulatory assurance</div>
  <div class="motif">
    <div class="node n1"><span></span></div>
    <div class="node n2"><span></span></div>
    <div class="node n3"><span></span></div>
    <div class="node n4"><span></span></div>
  </div>
  <div class="footer">RELEASE EVIDENCE / v1</div>
</div>
</body>
</html>
