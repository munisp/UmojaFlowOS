<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
*{box-sizing:border-box}
html,body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#0b1324;color:#f4f7fb;position:absolute;overflow:hidden;font-family:Arial,Helvetica,sans-serif;padding:72px 82px 0;left:0;top:0}
.eyebrow{font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#63d2c8;font-weight:700}
.title{font-size:64px;line-height:1.02;max-width:650px;margin-top:28px;font-weight:700;letter-spacing:-1px}
.subtitle{font-size:25px;line-height:1.35;color:#bac6d8;max-width:610px;margin-top:26px}
.meta{position:absolute;left:82px;bottom:68px;font-size:16px;color:#8fa1ba;letter-spacing:1px}
.rule{width:112px;height:5px;background:#63d2c8;margin-top:34px}
.layer{position:absolute;right:90px;top:120px;width:405px;height:380px}
.plane{position:absolute;width:280px;height:128px;border:2px solid #63d2c8;transform:skewY(-17deg) rotate(-4deg);background:rgba(20,45,68,.75)}
.plane.one{right:0;top:35px}
.plane.two{right:62px;top:155px;border-color:#7d91aa;background:rgba(24,36,58,.75)}
.plane.three{right:124px;top:275px;border-color:#3e627b;background:rgba(18,28,45,.75)}
.node{position:absolute;width:17px;height:17px;border-radius:50%;background:#f3c969;box-shadow:0 0 0 8px rgba(243,201,105,.13)}
.n1{right:28px;top:81px}
.n2{right:90px;top:201px}
.n3{right:152px;top:321px}
.label{position:absolute;right:2px;top:0;color:#b8c7d8;font-size:15px;letter-spacing:1.5px;text-transform:uppercase}
.label2{position:absolute;right:65px;top:330px;color:#63d2c8;font-size:15px;letter-spacing:1.5px;text-transform:uppercase}
</style>
</head>
<body>
<div class="slide-container">
  <div class="eyebrow">Stakeholder briefing · September 2026</div>
  <div class="title">TigerBeetle +<br/>Hyperledger Fabric</div>
  <div class="rule"></div>
  <div class="subtitle">Authoritative double-entry accounting with independently verifiable consortium attestation.</div>
  <div class="meta">UmojaFlowOS · For regulators, banks, custodians, auditors, and consortium partners</div>
  <div class="layer"><div class="label">Shared proof</div><div class="plane one"></div><div class="plane two"></div><div class="plane three"></div><div class="node n1"></div><div class="node n2"></div><div class="node n3"></div><div class="label2">Accounting authority</div></div>
</div>
</body>
</html>
