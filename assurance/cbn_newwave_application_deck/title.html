<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box} body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#f5f1e8;color:#17251f;font-family:Arial,Helvetica,sans-serif;position:relative;padding:56px 72px 0;overflow:hidden}
.eyebrow{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#167c69;font-weight:700}
.title{font-family:Georgia,serif;font-size:64px;line-height:1.02;max-width:760px;margin-top:34px;color:#143d31}
.subtitle{font-size:25px;line-height:1.35;margin-top:26px;max-width:690px;color:#45534d}
.status{display:inline-block;margin-top:34px;padding:12px 18px;border:1px solid #b47d3a;color:#8d5b20;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:14px}
.rule{width:112px;height:5px;background:#18a58a;margin-top:24px}
.motif{position:absolute;right:72px;top:104px;width:320px;height:420px;border:2px solid #167c69;transform:rotate(7deg)}
.motif:before{content:'';position:absolute;left:36px;top:52px;width:200px;height:200px;background:#167c69;opacity:.12;border:3px solid #167c69}
.motif:after{content:'EVIDENCE\A CONTROL\A REVIEW';white-space:pre;position:absolute;left:80px;top:122px;font-family:Georgia,serif;font-size:28px;line-height:1.45;color:#167c69;font-weight:700}
.footer{position:absolute;left:72px;right:72px;bottom:42px;border-top:1px solid #c8d1ca;padding-top:12px;font-size:13px;color:#66736d;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="slide-container">
<div class="eyebrow">Central Bank of Nigeria · Regulatory Sandbox · Cohort 2</div>
<div class="rule"></div>
<div class="title">Newwave CBN Sandbox Application</div>
<div class="subtitle">VASP Track · UmojaFlowOS controlled-risk and evidence platform</div>
<div class="status">Draft · Not for submission</div>
<div class="footer"><span>Executive application briefing</span><span>29 August 2026</span></div>
<div class="motif"></div>
</div>
</body>
</html>
