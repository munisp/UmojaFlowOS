name: Evidence Gateway Contract

on:
  pull_request:
    paths:
      - 'services/evidence-gateway/**'
      - 'infra/evidence-gateway/**'
      - 'tests/evidence_gateway/**'
      - 'scripts/infra/run_evidence_gateway_contracts.sh'
      - '.github/workflows/evidence-gateway-contract.yml'
  push:
    branches: [main]
    paths:
      - 'services/evidence-gateway/**'
      - 'infra/evidence-gateway/**'
      - 'tests/evidence_gateway/**'
      - 'scripts/infra/run_evidence_gateway_contracts.sh'
      - '.github/workflows/evidence-gateway-contract.yml'

permissions:
  contents: read

concurrency:
  group: evidence-gateway-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-keycloak-minio-contract:
    name: Keycloak JWT and MinIO WORM contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            services/evidence-gateway/requirements.txt

      - name: Install contract dependencies
        run: python -m pip install --requirement services/evidence-gateway/requirements.txt

      - name: Start Keycloak, MinIO, and gateway service containers
        run: docker compose -f infra/evidence-gateway/compose.yaml up -d --build

      - name: Wait for gateway health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8280/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/evidence-gateway/compose.yaml ps
          docker compose -f infra/evidence-gateway/compose.yaml logs --no-color
          exit 1

      - name: Run end-to-end contract tests
        env:
          EVIDENCE_GATEWAY_URL: http://127.0.0.1:8280
          KEYCLOAK_URL: http://127.0.0.1:8180
        run: pytest -q tests/evidence_gateway/test_gateway_contract.py

      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f infra/evidence-gateway/compose.yaml logs --no-color

      - name: Tear down service containers
        if: always()
        run: docker compose -f infra/evidence-gateway/compose.yaml down -v --remove-orphans
