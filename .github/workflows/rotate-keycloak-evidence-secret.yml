name: Rotate Keycloak Evidence Publisher Secret

on:
  workflow_dispatch:
    inputs:
      canary:
        description: "Run the protected non-production canary after rotation"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: keycloak-evidence-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    environment: production-release-evidence
    timeout-minutes: 15
    steps:
      - name: Check out rotation code
        uses: actions/checkout@v7

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: umoja-keycloak-evidence-rotation
          jwtGithubAudience: ${{ vars.VAULT_JWT_AUDIENCE }}
          exportToken: true
          secrets: |
            secret/data/umoja/keycloak/admin admin_client_id | KEYCLOAK_ADMIN_CLIENT_ID ;
            secret/data/umoja/keycloak/admin admin_client_secret | KEYCLOAK_ADMIN_CLIENT_SECRET ;
            secret/data/umoja/keycloak/evidence-publisher client_id | KEYCLOAK_CLIENT_ID ;
            secret/data/umoja/keycloak/evidence-publisher current_version | KEYCLOAK_SECRET_VERSION

      - name: Rotate Keycloak client secret and write new Vault version
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          KEYCLOAK_BASE_URL: ${{ vars.KEYCLOAK_BASE_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_ADMIN_CLIENT_ID: ${{ steps.vault.outputs.KEYCLOAK_ADMIN_CLIENT_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ steps.vault.outputs.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          KEYCLOAK_CLIENT_ID: ${{ steps.vault.outputs.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_SECRET_VERSION: ${{ steps.vault.outputs.KEYCLOAK_SECRET_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$VAULT_ADDR"; test -n "$VAULT_TOKEN"
          test -n "$KEYCLOAK_BASE_URL"; test -n "$KEYCLOAK_REALM"
          test -n "$KEYCLOAK_ADMIN_CLIENT_ID"; test -n "$KEYCLOAK_ADMIN_CLIENT_SECRET"
          test -n "$KEYCLOAK_CLIENT_ID"; test -n "$KEYCLOAK_SECRET_VERSION"

          admin_token="$(curl --fail-with-body --silent --show-error \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$KEYCLOAK_ADMIN_CLIENT_ID" \
            --data-urlencode "client_secret=$KEYCLOAK_ADMIN_CLIENT_SECRET" \
            "$KEYCLOAK_BASE_URL/realms/$KEYCLOAK_REALM/protocol/openid-connect/token" \
            | jq -er '.access_token')"
          trap 'unset admin_token new_secret client_uuid' EXIT

          client_uuid="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            "$KEYCLOAK_BASE_URL/admin/realms/$KEYCLOAK_REALM/clients?clientId=$(printf %s "$KEYCLOAK_CLIENT_ID" | jq -sRr @uri)" \
            | jq -er 'if length == 1 then .[0].id else error("client lookup is not unique") end')"

          new_secret="$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $admin_token" \
            "$KEYCLOAK_BASE_URL/admin/realms/$KEYCLOAK_REALM/clients/$client_uuid/client-secret" \
            | jq -er '.value | strings | select(length >= 32)')"
          echo "::add-mask::$new_secret"

          new_version="$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID"
          payload="$(jq -cn \
            --arg client_id "$KEYCLOAK_CLIENT_ID" \
            --arg client_secret "$new_secret" \
            --arg previous_version "$KEYCLOAK_SECRET_VERSION" \
            --arg current_version "$new_version" \
            '{data:{client_id:$client_id,client_secret:$client_secret,previous_version:$previous_version,current_version:$current_version}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Vault-Token: $VAULT_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            "$VAULT_ADDR/v1/secret/data/umoja/keycloak/evidence-publisher" \
            | jq -e '.data.created_time | strings | length > 0' >/dev/null

          printf 'rotation_version=%s\n' "$new_version" >> "$GITHUB_OUTPUT"
          printf 'secret_value_logged=false\n'

      - name: Run post-rotation canary
        if: inputs.canary
        env:
          CANARY_URL: ${{ vars.KEYCLOAK_CANARY_URL }}
          CANARY_TOKEN: ${{ secrets.KEYCLOAK_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CANARY_URL"; test -n "$CANARY_TOKEN"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CANARY_TOKEN" \
            "$CANARY_URL/healthz" >/dev/null

      - name: Record non-secret rotation metadata
        if: always()
        run: |
          set -euo pipefail
          printf 'rotation_workflow_run=%s\n' "$GITHUB_RUN_ID"
          printf 'keycloak_client_id=%s\n' '${{ vars.KEYCLOAK_EVIDENCE_CLIENT_ID }}'
          printf 'secret_values_are_not_logged=true\n'
