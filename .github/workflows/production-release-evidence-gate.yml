name: Production Release Evidence Gate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable signed tag or commit SHA under review
        required: true
        type: string
      evidence_manifest:
        description: Repository-relative path to the reviewed evidence manifest JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-evidence:
    name: Validate release evidence bundle
    runs-on: ubuntu-24.04
    environment: production-release-evidence
    steps:
      - name: Check out immutable release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Require an immutable clean revision
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          expected_sha=$(git rev-parse "${{ inputs.release_ref }}^{commit}")
          test "$expected_sha" = "$(git rev-parse HEAD)"

      - name: Validate complete evidence and independent approvals
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/infra/verify_production_release_evidence.py \
            --manifest "${{ inputs.evidence_manifest }}" \
            --repo .

      - name: Upload validated evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence-${{ github.sha }}
          path: ${{ inputs.evidence_manifest }}
          if-no-files-found: error
          retention-days: 2555
