name: retention-weekly-performance-report

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: Reporting window in days
        required: false
        default: '7'
        type: string

permissions:
  contents: read

concurrency:
  group: retention-weekly-performance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment: staging-observability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare protected Prometheus bearer token file
        env:
          PROMETHEUS_BEARER_TOKEN: ${{ secrets.STAGING_PROMETHEUS_BEARER_TOKEN }}
        run: |
          test -n "$PROMETHEUS_BEARER_TOKEN" || { echo 'STAGING_PROMETHEUS_BEARER_TOKEN is required'; exit 2; }
          printf '%s' "$PROMETHEUS_BEARER_TOKEN" > "$RUNNER_TEMP/prometheus-token"
          chmod 600 "$RUNNER_TEMP/prometheus-token"
      - name: Generate weekly regression report
        env:
          PROMETHEUS_URL: ${{ secrets.STAGING_PROMETHEUS_URL }}
          PROMETHEUS_BEARER_TOKEN_FILE: ${{ runner.temp }}/prometheus-token
          REPORT_DAYS: ${{ inputs.days || '7' }}
        run: |
          test -n "$PROMETHEUS_URL" || { echo 'STAGING_PROMETHEUS_URL is required'; exit 2; }
          python3 scripts/infra/report_retention_worker_prometheus_weekly.py \
            --days "$REPORT_DAYS" \
            --output-dir "$RUNNER_TEMP/retention-weekly-report"
      - name: Publish sanitized weekly gauges for Grafana
        env:
          PROMETHEUS_PUSHGATEWAY_URL: ${{ secrets.STAGING_PROMETHEUS_PUSHGATEWAY_URL }}
          PROMETHEUS_PUSHGATEWAY_BEARER_TOKEN: ${{ secrets.STAGING_PROMETHEUS_PUSHGATEWAY_BEARER_TOKEN }}
        run: |
          test -n "$PROMETHEUS_PUSHGATEWAY_URL" || { echo 'STAGING_PROMETHEUS_PUSHGATEWAY_URL is required'; exit 2; }
          test -n "$PROMETHEUS_PUSHGATEWAY_BEARER_TOKEN" || { echo 'STAGING_PROMETHEUS_PUSHGATEWAY_BEARER_TOKEN is required'; exit 2; }
          printf '%s' "$PROMETHEUS_PUSHGATEWAY_BEARER_TOKEN" > "$RUNNER_TEMP/pushgateway-token"
          chmod 600 "$RUNNER_TEMP/pushgateway-token"
          python3 scripts/infra/publish_retention_weekly_summary_prometheus.py \
            --summary-json "$RUNNER_TEMP/retention-weekly-report/weekly-summary.json" \
            --pushgateway-url "$PROMETHEUS_PUSHGATEWAY_URL" \
            --bearer-token-file "$RUNNER_TEMP/pushgateway-token"
      - name: Add report to job summary
        run: cat "$RUNNER_TEMP/retention-weekly-report/weekly-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized performance report
        uses: actions/upload-artifact@v4
        with:
          name: retention-weekly-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/retention-weekly-report/
          if-no-files-found: error
          retention-days: 90
