name: Native Idem Compliance

on:
  pull_request:
    paths:
      - 'infra/opa/**'
      - 'infra/monitoring/**'
      - 'deploy/helm/umoja-payment-engine/**'
      - 'infra/terraform/**'
      - 'test/terratest/**'
      - '.github/workflows/native-idem-compliance.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.70.0
      - name: Install Conftest
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz \
            | tar -xz conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install promtool
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz \
            | tar -xz --strip-components=1 --wildcards '*/promtool'
          sudo install -m 0755 promtool /usr/local/bin/promtool
      - name: OPA unit tests
        run: opa test infra/opa -v
      - name: Rego policy lint
        run: |
          set -Eeuo pipefail
          mapfile -t policy_files < <(find infra/opa -maxdepth 1 -type f -name '*.rego' -print | sort)
          if [ "${#policy_files[@]}" -eq 0 ]; then
            echo 'No Rego policy files found' >&2
            exit 1
          fi
          conftest verify --policy infra/opa "${policy_files[@]}"
      - name: Prometheus rule validation
        run: promtool check rules infra/monitoring/umoja-native-idem-alerts.yml
      - name: Helm lint and render
        run: |
          set -Eeuo pipefail
          helm lint deploy/helm/umoja-payment-engine \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set objectStorage.endpoint=https://s3-compatible.invalid \
            --set objectStorage.bucket=umoja-release-evidence \
            --set vault.address=https://vault.invalid \
            --set vault.objectStorageSecretPath=secret/data/umoja/object-storage
          helm template umoja-payment-engine deploy/helm/umoja-payment-engine \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set objectStorage.endpoint=https://s3-compatible.invalid \
            --set objectStorage.bucket=umoja-release-evidence \
            --set vault.address=https://vault.invalid \
            --set vault.objectStorageSecretPath=secret/data/umoja/object-storage \
            > rendered-native-idem.yaml
      # Not kubectl apply --dry-run=client: it still needs live server
      # discovery to resolve resource kinds (Deployment, HPA, ...) to their
      # API group/version, separate from --validate's schema check and
      # unaffected by --validate=false - there's no cluster here (confirmed
      # live, both with and without --validate=false: "dial tcp [::1]:8080:
      # connect: connection refused"). kubeconform validates structurally
      # against bundled offline OpenAPI schemas, which is what this step
      # actually needs - catching YAML/structural errors, not checking
      # against one specific cluster's API surface.
      - name: Install kubeconform
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Kubernetes manifest validation (offline schema, no cluster)
        run: kubeconform --strict --summary rendered-native-idem.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: native-idem-rendered-manifests
          path: rendered-native-idem.yaml

  terratest-kind:
    needs: policy-and-manifest-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.10.0
        with:
          version: v0.25.0
          node_image: kindest/node:v1.31.2
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/payment-engine/go.mod
          cache: true
      - name: Run Terratest against ephemeral Kind
        working-directory: test/terratest/native-idem
        run: go test -v -timeout 20m ./...
      - name: Collect cluster evidence
        if: always()
        run: |
          kubectl get nodes -o wide > kind-nodes.txt
          kubectl get pods -A -o wide > kind-pods.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-idem-kind-evidence
          path: '*-*.txt'
