name: Monorepo validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Contracts and services
    runs-on: ubuntu-latest
    env:
      POSTGRES_DATABASE_URL: postgresql://postgres@localhost:5432/umojaflowos_dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: umojaflowos_dev
          POSTGRES_USER: postgres
          # CI service containers are isolated to the runner and receive no production credential.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d umojaflowos_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: apps/control-plane/pnpm-lock.yaml
      - name: Enable pinned package manager
        run: corepack enable
      - name: Apply canonical PostgreSQL schema
        run: |
          for migration in database/postgresql/[0-9]*.sql; do
            psql "$POSTGRES_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run contract and service checks
        run: make check postgres-check

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
