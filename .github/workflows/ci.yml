name: Monorepo validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Contracts and services
    runs-on: ubuntu-latest
    env:
      POSTGRES_DATABASE_URL: postgresql://postgres@localhost:5432/umojaflowos_dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: umojaflowos_dev
          POSTGRES_USER: postgres
          # CI service containers are isolated to the runner and receive no production credential.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d umojaflowos_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CI validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: apps/control-plane/pnpm-lock.yaml
      - name: Enable pinned package manager
        run: corepack enable
      - name: Apply canonical PostgreSQL schema
        run: |
          for migration in database/postgresql/[0-9]*.sql; do
            psql "$POSTGRES_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run contract and service checks
        run: make check postgres-check
      - name: Run SoD monitor integration test
        working-directory: apps/control-plane
        run: pnpm exec vitest run server/segregationOfDutiesMonitor.integration.test.ts --pool=threads --poolOptions.threads.singleThread=true
      - name: Validate Wazuh XML and verifier scripts
        run: |
          bash -n scripts/infra/verify_sod_alerting_and_worm.sh
          bash -n scripts/infra/verify_worm_retention_aws_openssl.sh
          python3 -m py_compile infra/wazuh/custom-umoja-sod-incident.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse(Path('infra/wazuh/umoja-sod-rules.xml.template'))
          ET.parse(Path('infra/wazuh/umoja-sod-agent-ossec.conf.template'))
          ET.parse(Path('infra/wazuh/umoja-sod-manager-integration.conf.template'))
          ET.fromstring('<root>' + Path('infra/wazuh/umoja-sod-decoders.xml.template').read_text() + '</root>')
          PY
      - name: Run SoD acceptance gate in synthetic CI-only WORM mode
        run: |
          cat > /tmp/umoja-ci-worm-stub.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo synthetic-worm-verifier=passed
          EOF
          chmod 700 /tmp/umoja-ci-worm-stub.sh
          CI=true WORM_VERIFIER_MODE=synthetic WORM_VERIFY_SCRIPT=/tmp/umoja-ci-worm-stub.sh \
            bash scripts/infra/verify_sod_alerting_and_worm.sh check

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
