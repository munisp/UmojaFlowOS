[package]
name = "ledger-gateway"
version = "0.1.0"
edition = "2021"

[lib]
name = "ledger_gateway"
path = "src/lib.rs"

[[bin]]
name = "ledger-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
# Exercises the real axum router in-process; no listener is opened.
tower = { version = "0.5", features = ["util"] }
