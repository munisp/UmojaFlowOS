[package]
name = "risk-compliance-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "risk_compliance_core"
path = "src/lib.rs"

[[bin]]
name = "risk-compliance-core"
path = "src/main.rs"

[[bin]]
name = "stress-test-runner"
path = "src/bin/stress_test_runner.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fluvio = "0.50.1"
opentelemetry = "0.28"
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
tracing = "0.1"
tracing-opentelemetry = "0.29"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
# Exercises the real axum router in-process so route registration is asserted
# rather than assumed. The tests open no network listener.
tower = { version = "0.5", features = ["util"] }
