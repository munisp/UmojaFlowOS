[project]
name = "umojaflowos-document-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
description = "KYC and KYB OCR, document parsing, visual-evidence, and review-required risk analysis for UmojaFlowOS"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.20",
  "pillow>=10.0",
  "paddleocr>=3.0",
  "docling>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
