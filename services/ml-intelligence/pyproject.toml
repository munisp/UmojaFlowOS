[project]
name = "umojaflowos-ml-intelligence"
version = "1.0.0"
requires-python = ">=3.11"
description = "Real end-to-end AI/ML/DL/GNN stack for UmojaFlowOS: PyTorch fraud, credit, GNN mule-detection and deep anomaly models with trained weights, training loops, Lakehouse integration, Ray distributed compute, MLflow registry, A/B testing, drift monitoring and continuous training"
dependencies = [
  "torch>=2.1",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyarrow>=15.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
registry = ["mlflow>=2.10"]
distributed = ["ray>=2.9"]
graph = ["neo4j>=5.14"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
